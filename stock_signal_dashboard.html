const allData = {};
raw.trim().split('\n').forEach(line => {
  const [date, ticker, signal, price] = line.split(',');
  if (!allData[ticker]) allData[ticker] = [];
  allData[ticker].push({ date, signal, price: parseFloat(price) });
});

const sigColors = { BUY: '#1D9E75', SELL: '#D85A30', HOLD: '#888780' };
const sigBg = { BUY: '#E1F5EE', SELL: '#FAECE7', HOLD: '#F1EFE8' };

let priceChartInst = null;
let signalChartInst = null;

function buildLegend() {
  const box = document.getElementById('legendBox');
  box.innerHTML = Object.entries(sigColors).map(([s,c]) =>
    `<span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:${c}"></span>${s}</span>`
  ).join('');
}

function getMonthlySignals(rows) {
  const months = {};
  rows.forEach(r => {
    const m = r.date.substring(0,7);
    if (!months[m]) months[m] = {BUY:0,SELL:0,HOLD:0};
    months[m][r.signal] = (months[m][r.signal]||0)+1;
  });
  return months;
}

function update() {
  const ticker = document.getElementById('tickerSel').value;
  const rows = allData[ticker] || [];
  if (!rows.length) return;

  const first = rows[0].price, last = rows[rows.length-1].price;
  const pct = (((last-first)/first)*100).toFixed(1);
  const sign = pct >= 0 ? '+' : '';
  const latestSignal = rows[rows.length-1].signal;
  const buyCount = rows.filter(r=>r.signal==='BUY').length;

  document.getElementById('latestPrice').textContent = '$'+last.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const changeEl = document.getElementById('periodChange');
  changeEl.textContent = sign+pct+'%';
  changeEl.style.color = pct >= 0 ? sigColors.BUY : sigColors.SELL;

  const sigEl = document.getElementById('todaySignal');
  sigEl.textContent = latestSignal;
  sigEl.style.color = sigColors[latestSignal];

  document.getElementById('buyDays').textContent = buyCount + ' days';

  const labels = rows.map(r => r.date);
  const prices = rows.map(r => r.price);

  const buyPts = rows.map(r => r.signal==='BUY' ? r.price : null);
  const sellPts = rows.map(r => r.signal==='SELL' ? r.price : null);
  const holdPts = rows.map(r => r.signal==='HOLD' ? r.price : null);

  if (priceChartInst) priceChartInst.destroy();
  priceChartInst = new Chart(document.getElementById('priceChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Price', data: prices, borderColor: '#378ADD', borderWidth: 1.5, pointRadius: 0, tension: 0.2, fill: false, order: 1 },
        { label: 'BUY', data: buyPts, type: 'scatter', pointBackgroundColor: '#1D9E75', pointRadius: 4, pointStyle: 'circle', showLine: false, order: 0 },
        { label: 'SELL', data: sellPts, type: 'scatter', pointBackgroundColor: '#D85A30', pointRadius: 4, pointStyle: 'triangle', showLine: false, order: 0 },
        { label: 'HOLD', data: holdPts, type: 'scatter', pointBackgroundColor: '#888780', pointRadius: 3, pointStyle: 'rect', showLine: false, order: 0 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ctx.dataset.label+': $'+ctx.parsed.y.toFixed(2) }
      }},
      scales: {
        x: { ticks: { maxRotation: 45, autoSkip: true, maxTicksLimit: 10, font: {size:11} }, grid: { display: false } },
        y: { ticks: { callback: v => '$'+v.toLocaleString(), font: {size:11} }, grid: { color: 'rgba(128,128,128,0.1)' } }
      }
    }
  });

  const monthly = getMonthlySignals(rows);
  const mLabels = Object.keys(monthly).sort();
  const buyCounts = mLabels.map(m => monthly[m].BUY||0);
  const sellCounts = mLabels.map(m => monthly[m].SELL||0);
  const holdCounts = mLabels.map(m => monthly[m].HOLD||0);

  if (signalChartInst) signalChartInst.destroy();
  signalChartInst = new Chart(document.getElementById('signalBar'), {
    type: 'bar',
    data: {
      labels: mLabels,
      datasets: [
        { label: 'BUY', data: buyCounts, backgroundColor: '#1D9E75' },
        { label: 'SELL', data: sellCounts, backgroundColor: '#D85A30' },
        { label: 'HOLD', data: holdCounts, backgroundColor: '#888780' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { stacked: true, ticks: { font:{size:11} }, grid:{display:false} },
        y: { stacked: true, ticks: { font:{size:11}, stepSize:1 }, grid:{color:'rgba(128,128,128,0.1)'} }
      }
    }
  });
}

buildLegend();
document.getElementById('tickerSel').addEventListener('change', update);
update();
</script>
